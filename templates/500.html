<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | FaceMate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 text-center border border-slate-200">
        <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
            ⚙️
        </div>
        <h1 class="text-3xl font-extrabold text-slate-900 mb-2">Something Went Wrong</h1>
        <p class="text-slate-600 text-sm mb-6">
            Unable to complete this operation. Your attendance roster has not been corrupted. Please review the roster and try again.
        </p>
        <div class="flex flex-col gap-2.5">
            <a href="javascript:history.back()" class="w-full py-2.5 px-4 bg-slate-800 hover:bg-slate-900 text-white font-medium rounded-xl text-sm transition">
                Go Back & Review Roster
            </a>
            <a href="{% url 'home_page' %}" class="w-full py-2.5 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-xl text-sm transition">
                Return to Home
            </a>
        </div>
    </div>
</body>
</html>
