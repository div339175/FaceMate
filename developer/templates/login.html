<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Login | FaceMate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="w-full max-w-md p-8 space-y-8 bg-white rounded-xl shadow-lg">
        <div class="text-center">
            <h1 class="text-3xl font-bold text-gray-900">Developer Login</h1>
            <p class="mt-2 text-sm text-gray-600">Welcome back to FaceMate</p>
        </div>

        <!-- Display Messages -->
        {% if messages %}
            <div class="p-4 mb-4 text-sm text-red-700 bg-red-100 rounded-lg" role="alert">
                {% for message in messages %}
                    <span class="font-medium">{{ message }}</span>
                {% endfor %}
            </div>
        {% endif %}

        <form class="mt-8 space-y-6" action="{% url 'developer_login' %}" method="POST">
            {% csrf_token %}
            <div class="space-y-4 rounded-md shadow-sm">
                <div>
                    <label for="email" class="sr-only">Email address</label>
                    <input id="email" name="email" type="email" autocomplete="email" required
                        class="relative block w-full px-3 py-3 text-gray-900 placeholder-gray-500 border border-gray-300 rounded-md appearance-none focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm"
                        placeholder="Email address">
                </div>
                <div>
                    <label for="password" class="sr-only">Password</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required
                        class="relative block w-full px-3 py-3 text-gray-900 placeholder-gray-500 border border-gray-300 rounded-md appearance-none focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm"
                        placeholder="Password">
                </div>
            </div>

            <div>
                <button type="submit"
                    class="relative flex justify-center w-full px-4 py-3 text-sm font-medium text-white bg-indigo-600 border border-transparent rounded-md group hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    Sign in
                </button>
            </div>
        </form>

        {% if demo_login_enabled %}
        <form class="mt-3" action="{% url 'developer_demo_login' %}" method="POST">
            {% csrf_token %}
            <button type="submit" class="w-full px-4 py-3 text-sm font-medium text-indigo-700 bg-indigo-50 border border-indigo-300 rounded-md hover:bg-indigo-100">
                Try the developer demo
            </button>
        </form>
        {% endif %}

        <!-- Back to Home Link -->
        <div class="mt-4 text-center">
            <a href="{% url 'home_page' %}" class="text-sm text-indigo-600 hover:text-indigo-800 font-medium">
                ← Back to Home
            </a>
        </div>
    </div>
</body>
</html>
