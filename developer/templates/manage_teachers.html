<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Teachers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="container mx-auto mt-10 p-8 bg-white rounded-lg shadow-lg max-w-4xl">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-700">Manage Teachers</h1>
            <div class="flex gap-3">
                <a href="{% url 'teacher_register' %}" class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 transition duration-300">+ Register Teacher</a>
                <a href="{% url 'developer_dashboard' %}" class="px-4 py-2 bg-gray-500 text-white rounded-md hover:bg-gray-600 transition duration-300">Back to Dashboard</a>
            </div>
        </div>

        <div class="overflow-x-auto">
            <table class="min-w-full bg-white border">
                <thead class="bg-gray-200">
                    <tr>
                        <th class="py-3 px-4 border-b text-left">Name</th>
                        <th class="py-3 px-4 border-b text-left">Email</th>
                        <th class="py-3 px-4 border-b text-left">Class Teacher For</th>
                        <th class="py-3 px-4 border-b text-center">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for teacher in teachers %}
                    <tr class="hover:bg-gray-50">
                        <td class="py-3 px-4 border-b">{{ teacher.name }}</td>
                        <td class="py-3 px-4 border-b">{{ teacher.email }}</td>
                        <td class="py-3 px-4 border-b">{{ teacher.class_teacher_for }}</td>
                        <td class="py-3 px-4 border-b text-center whitespace-nowrap">
                            <a href="{% url 'edit_teacher' teacher.id %}" class="inline-block bg-blue-500 text-white px-3 py-1 rounded-md hover:bg-blue-600 transition duration-300 mr-2">Edit</a>
                            <form method="POST" action="{% url 'delete_teacher' teacher.id %}" class="inline-block" onsubmit="return confirm('Are you sure you want to delete teacher {{ teacher.name }}?');">
                                {% csrf_token %}
                                <button type="submit" class="bg-red-500 text-white px-3 py-1 rounded-md hover:bg-red-600 transition duration-300">Delete</button>
                            </form>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="4" class="py-4 px-4 text-center text-gray-500">No teachers have been registered yet.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
